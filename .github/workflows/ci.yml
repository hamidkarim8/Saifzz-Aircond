name: CI

on:
  pull_request:
    branches: [main]   # gate every dev -> main PR
  workflow_call:       # lets deploy.yml reuse this job before deploying

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saifzz_testing
          POSTGRES_USER: saifzz
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql, redis, mbstring, xml, curl, zip, bcmath
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          echo "DB_HOST=127.0.0.1"          >> .env
          echo "DB_PORT=5432"               >> .env
          echo "DB_DATABASE=saifzz_testing" >> .env
          echo "DB_USERNAME=saifzz"         >> .env
          echo "DB_PASSWORD=secret"         >> .env
          echo "QUEUE_CONNECTION=sync"      >> .env
          echo "CACHE_STORE=array"          >> .env
          echo "SESSION_DRIVER=array"       >> .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets (Vite manifest needed by Inertia tests)
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test
