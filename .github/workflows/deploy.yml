name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server host key
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
            set -e
            cd /var/www/Saifzz-Aircond

            echo "==> Handing storage back to deploy so git can reset it"
            docker run --rm -v "$PWD/storage:/s" alpine chown -R "$(id -u):$(id -g)" /s

            echo "==> Pulling latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Pruning unused Docker images and cache"
            docker system prune -af

            echo "==> Rebuilding app containers (includes npm build inside Docker)"
            docker compose -f docker-compose.prod.yml build app worker
            docker compose -f docker-compose.prod.yml up -d --no-deps app worker

            echo "==> Restoring storage ownership to php-fpm uid (82)"
            docker run --rm -v "$PWD/storage:/s" alpine chown -R 82:82 /s

            echo "==> Copying built assets from container to host for nginx"
            rm -rf ./public/build
            docker compose -f docker-compose.prod.yml cp app:/var/www/Saifzz-Aircond/public/build ./public/build

            echo "==> Running migrations"
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "==> Caching config/routes/views"
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize

            echo "==> Deploy complete"
          ENDSSH
